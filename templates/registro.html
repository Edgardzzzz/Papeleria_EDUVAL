<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Papelería Eduval</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('home') }}" class="nav-btn">INICIO</a>
        <a href="{{ url_for('catalogo') }}" class="nav-btn">CATÁLOGO</a>
        <a href="{{ url_for('login') }}" class="nav-btn">LOGIN</a>
    </div>

    <div class="form-container">
        <h2 class="form-title">REGISTRO DE USUARIO</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="nombre_usuario">USUARIO</label>
                <input type="text" id="nombre_usuario" name="nombre_usuario" required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
                <small style="color: #6B7280; font-size: 12px; display: block; margin-top: 4px;">
                    Necesario para recuperar contraseña
                </small>
            </div>

            <div class="form-group">
                <label for="contraseña">CONTRASEÑA</label>
                <input type="password" id="contraseña" name="contraseña" required minlength="6">
            </div>

            <div class="form-group">
                <label for="rol">ROL</label>
                <select id="rol" name="rol" required>
                    <option value="empleado">Empleado</option>
                    <option value="cajero">Cajero</option>
                    <option value="administrador">Administrador</option>
                </select>
            </div>

            <div class="form-group">
                <label for="clave_registro">CLAVE DE REGISTRO</label>
                <input type="password" id="clave_registro" name="clave_registro" required 
                       placeholder="Clave de acceso para crear usuarios">
            </div>

            <button type="submit" class="btn-primary">REGISTRARSE</button>
        </form>

        <div class="form-footer">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a>
        </div>
    </div>
</body>
</html>
